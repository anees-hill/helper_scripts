# Prefix
#
# Default:
#   Ctrl-x
#
# Outer/local tmux:
#   HELPER_TMUX_OUTER=1 tmux
#   Uses Ctrl-z instead, so remote/server tmux can keep Ctrl-x.
unbind C-b
unbind C-x
unbind C-z

set -g prefix C-x
bind C-x send-prefix

if-shell '[ "${HELPER_TMUX_OUTER:-0}" = "1" ]' \
  'set -g prefix C-z; bind C-z send-prefix'


# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# Mouse / clipboard
set -g mouse on
set -g set-clipboard off


# Terminal colours
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

set -as terminal-overrides ',*:Tc'


# Reload config
bind r source-file ~/.tmux.conf \; display ".tmux.conf reloaded"


# Scrollback
set -g history-limit 500000


# Status bar
set -g status on
set -g status-interval 5
set -g status-style fg=colour231,bg=colour235


# Left: session name
set -g status-left-length 40
set -g status-left "#[fg=colour16,bg=colour250,bold] #S #[fg=colour250,bg=colour235] "


# Window list
setw -g window-status-format "#[bg=colour235]#{?window_activity_flag,#[fg=colour255]● ,}#[fg=colour250]#I:#W "
setw -g window-status-current-format "#[fg=colour16,bg=colour220,bold] #I:#W "


# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off


# Bell style
setw -g window-status-bell-style fg=colour16,bg=colour196,bold


# Right: path, host, time
set -g status-right-length 120
set -g status-right "#[fg=colour250]#{pane_current_path} #[fg=colour244]| #[fg=colour250]#H #[fg=colour244]| #[fg=colour252,bold]%H:%M "


# Message / copy-mode styling
set -g message-style fg=colour16,bg=colour252,bold
set -g mode-style fg=colour16,bg=colour252,bold


# Rename windows based on active command
set -g automatic-rename on


# tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-resurrect / tmux-continuum
set -g @resurrect-dir '~/.tmux/resurrect'

# TPM must stay at the bottom
run '~/.tmux/plugins/tpm/tpm'
